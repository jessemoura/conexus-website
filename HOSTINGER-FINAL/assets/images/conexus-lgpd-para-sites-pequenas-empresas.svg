<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_lgpd_para_sites_pequenas_empresas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071426" />
      <stop offset="100%" stop-color="#164E63" />
    </linearGradient>
    <pattern id="gridPattern_lgpd_para_sites_pequenas_empresas" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_lgpd_para_sites_pequenas_empresas)" />
  <rect width="860" height="440" fill="url(#gridPattern_lgpd_para_sites_pequenas_empresas)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#22D3EE" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- LGPD Privacy Shield and Compliance Protocol -->
      <rect x="70" y="30" width="420" height="210" rx="12" fill="#071426" stroke="#22D3EE" stroke-width="2"/>
      <text x="110" y="75" fill="#22D3EE" font-size="20" font-weight="900">LGPD <tspan fill="#FFFFFF">Conformidade Legal</tspan></text>
      <!-- Compliance check items -->
      <text x="110" y="115" fill="#10B981" font-size="13">✔ Banner de Cookies com Gestão de Consentimento</text>
      <text x="110" y="145" fill="#10B981" font-size="13">✔ Política de Privacidade e Termos de Uso Claros</text>
      <text x="110" y="175" fill="#10B981" font-size="13">✔ Armazenamento Criptografado de Leads</text>
      <text x="110" y="205" fill="#10B981" font-size="13">✔ Direitos dos Titulares de Dados Resguardados</text>
      <!-- Stamp -->
      <rect x="360" y="45" width="110" height="35" rx="6" fill="#10B981"/>
      <text x="415" y="67" fill="#071A2F" font-size="12" font-weight="900" text-anchor="middle">100% SEGURO</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#071426" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="252" height="26" rx="4" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-width="1.2" />
    <text x="12" y="17" fill="#22D3EE" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CRESCIMENTO &amp; TECNOLOGIA</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">LGPD para Sites: O Que Pequenas</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">e Médias Empresas Precisam Saber e Aplicar</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>