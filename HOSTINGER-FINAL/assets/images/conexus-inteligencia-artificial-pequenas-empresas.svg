<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_inteligencia_artificial_para_pequenas_empresas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <pattern id="gridPattern_inteligencia_artificial_para_pequenas_empresas" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_inteligencia_artificial_para_pequenas_empresas)" />
  <rect width="860" height="440" fill="url(#gridPattern_inteligencia_artificial_para_pequenas_empresas)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#818CF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- AI Neural Microchip and Brain Nodes -->
      <rect x="200" y="50" width="160" height="160" rx="16" fill="#0F172A" stroke="#818CF8" stroke-width="3"/>
      <circle cx="280" cy="130" r="40" fill="none" stroke="#818CF8" stroke-width="3"/>
      <text x="280" y="138" fill="#818CF8" font-size="26" font-weight="900" text-anchor="middle">AI</text>
      <!-- Neural Pins -->
      <line x1="200" y1="80" x2="150" y2="80" stroke="#818CF8" stroke-width="3"/>
      <line x1="200" y1="130" x2="150" y2="130" stroke="#818CF8" stroke-width="3"/>
      <line x1="200" y1="180" x2="150" y2="180" stroke="#818CF8" stroke-width="3"/>
      <line x1="360" y1="80" x2="410" y2="80" stroke="#818CF8" stroke-width="3"/>
      <line x1="360" y1="130" x2="410" y2="130" stroke="#818CF8" stroke-width="3"/>
      <line x1="360" y1="180" x2="410" y2="180" stroke="#818CF8" stroke-width="3"/>
      <circle cx="140" cy="80" r="8" fill="#00F0FF"/>
      <circle cx="140" cy="130" r="8" fill="#00F0FF"/>
      <circle cx="140" cy="180" r="8" fill="#00F0FF"/>
      <circle cx="420" cy="80" r="8" fill="#38BDF8"/>
      <circle cx="420" cy="130" r="8" fill="#38BDF8"/>
      <circle cx="420" cy="180" r="8" fill="#38BDF8"/>
      <text x="280" y="245" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">INTELIGÊNCIA COMPUTACIONAL APLICADA</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0F172A" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="242.5" height="26" rx="4" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#818CF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">INTELIGÊNCIA ARTIFICIAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Inteligência Artificial para Pequenas Empresas: O</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Guia Definitivo de Aplicação Prática</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>