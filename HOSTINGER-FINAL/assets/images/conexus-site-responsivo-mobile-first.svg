<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_site_responsivo_mobile_first_indispensavel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#134074" />
    </linearGradient>
    <pattern id="gridPattern_site_responsivo_mobile_first_indispensavel" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_site_responsivo_mobile_first_indispensavel)" />
  <rect width="860" height="440" fill="url(#gridPattern_site_responsivo_mobile_first_indispensavel)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#00F0FF" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(80, 25)">
      <!-- Desktop Monitor -->
      <rect x="50" y="30" width="300" height="190" rx="10" fill="#0B2545" stroke="#00F0FF" stroke-width="2"/>
      <line x1="50" y1="65" x2="350" y2="65" stroke="#00F0FF" stroke-width="1" opacity="0.4"/>
      <rect x="70" y="85" width="120" height="60" rx="4" fill="#00F0FF" opacity="0.2"/>
      <rect x="210" y="85" width="120" height="15" rx="3" fill="#FFFFFF" opacity="0.4"/>
      <rect x="210" y="110" width="100" height="15" rx="3" fill="#FFFFFF" opacity="0.4"/>
      <rect x="210" y="135" width="70" height="20" rx="4" fill="#00F0FF" opacity="0.8"/>
      <!-- Monitor Stand -->
      <path d="M 180 220 L 170 250 L 230 250 L 220 220 Z" fill="#00F0FF" opacity="0.6"/>
      <!-- Tablet -->
      <rect x="310" y="70" width="130" height="170" rx="10" fill="#071A2F" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="375" cy="228" r="4" fill="#38BDF8"/>
      <rect x="325" y="85" width="100" height="30" rx="4" fill="#38BDF8" opacity="0.2"/>
      <rect x="325" y="125" width="100" height="12" rx="3" fill="#FFFFFF" opacity="0.4"/>
      <!-- Smartphone -->
      <rect x="420" y="100" width="80" height="150" rx="10" fill="#0B2545" stroke="#22D3EE" stroke-width="2.5"/>
      <circle cx="460" cy="238" r="3.5" fill="#22D3EE"/>
      <rect x="430" y="115" width="60" height="30" rx="4" fill="#22D3EE" opacity="0.3"/>
      <rect x="430" y="155" width="60" height="8" rx="2" fill="#FFFFFF" opacity="0.5"/>
      <rect x="430" y="170" width="40" height="14" rx="3" fill="#22D3EE" opacity="0.9"/>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0B2545" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1.2" />
    <text x="12" y="17" fill="#00F0FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">WEBSITES &amp; DESIGN</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Site Responsivo: Por que o Mobile</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">First é Indispensável em 2026</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>