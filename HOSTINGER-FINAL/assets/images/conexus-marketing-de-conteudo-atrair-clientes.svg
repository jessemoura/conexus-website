<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_marketing_de_conteudo_atrair_sem_anuncios" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <pattern id="gridPattern_marketing_de_conteudo_atrair_sem_anuncios" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_marketing_de_conteudo_atrair_sem_anuncios)" />
  <rect width="860" height="440" fill="url(#gridPattern_marketing_de_conteudo_atrair_sem_anuncios)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#60A5FA" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Content Inbound Magnet -->
      <path d="M 120 70 L 180 70 L 180 110 L 150 110 L 150 170 Q 150 200 180 200 L 380 200 Q 410 200 410 170 L 410 110 L 380 110 L 380 70 L 440 70 L 440 170 Q 440 240 380 240 L 180 240 Q 120 240 120 170 Z" fill="#60A5FA"/>
      <rect x="120" y="70" width="60" height="25" fill="#EF4444"/>
      <rect x="380" y="70" width="60" height="25" fill="#EF4444"/>
      <!-- Inbound client particles -->
      <circle cx="280" cy="60" r="12" fill="#10B981"/>
      <circle cx="240" cy="100" r="10" fill="#00F0FF"/>
      <circle cx="320" cy="100" r="10" fill="#00F0FF"/>
      <circle cx="280" cy="130" r="14" fill="#F59E0B"/>
      <text x="280" y="180" fill="#071A2F" font-size="14" font-weight="900" text-anchor="middle">ATRAÇÃO ORGÂNICA</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#111827" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#60A5FA" fill-opacity="0.15" stroke="#60A5FA" stroke-width="1.2" />
    <text x="12" y="17" fill="#60A5FA" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MARKETING DIGITAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Marketing de Conteúdo Estratégico: Como Atrair</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Clientes Sem Depender Apenas de Anúncios</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>