<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_seo_tecnico_fatores_crescimento_google" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A2F" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
    <pattern id="gridPattern_seo_tecnico_fatores_crescimento_google" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_seo_tecnico_fatores_crescimento_google)" />
  <rect width="860" height="440" fill="url(#gridPattern_seo_tecnico_fatores_crescimento_google)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#38BDF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Code brackets, schema and server gears -->
      <rect x="60" y="25" width="440" height="220" rx="12" fill="#071A2F" stroke="#38BDF8" stroke-width="2"/>
      <text x="100" y="70" fill="#38BDF8" font-size="28" font-family="monospace" font-weight="900">&lt;SEO Técnico /&gt;</text>
      <!-- Technical checklist -->
      <text x="100" y="110" fill="#10B981" font-size="14" font-family="monospace">✔ Schema.org JSON-LD Estruturado</text>
      <text x="100" y="140" fill="#10B981" font-size="14" font-family="monospace">✔ Canonical Tags &amp; Hreflang</text>
      <text x="100" y="170" fill="#10B981" font-size="14" font-family="monospace">✔ Sitemap.xml &amp; Robots.txt Válidos</text>
      <text x="100" y="200" fill="#10B981" font-size="14" font-family="monospace">✔ Compressão Brotli &amp; Cache L2</text>
      <!-- Gear -->
      <circle cx="430" cy="80" r="30" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="8,6"/>
      <circle cx="430" cy="80" r="10" fill="#38BDF8"/>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#071A2F" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="138" height="26" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#38BDF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SEO &amp; GOOGLE</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">SEO Técnico: Os Fatores Ocultos que</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Ajudam um Site a Crescer no Google</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>