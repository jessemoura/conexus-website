<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_como_aparecer_no_google_curitiba" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A2F" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
    <pattern id="gridPattern_como_aparecer_no_google_curitiba" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_como_aparecer_no_google_curitiba)" />
  <rect width="860" height="440" fill="url(#gridPattern_como_aparecer_no_google_curitiba)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#38BDF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Curitiba Skyline & Google Pin -->
      <path d="M 70 210 L 110 160 L 140 210 L 180 130 L 220 210 L 260 110 L 300 210 L 340 150 L 380 210 L 420 120 L 460 210 L 500 170 L 500 230 L 70 230 Z" fill="#0F4C81" opacity="0.7"/>
      <!-- Jardim Botanico Silhouette Dome -->
      <path d="M 240 210 Q 280 130 320 210 Z" fill="none" stroke="#38BDF8" stroke-width="3"/>
      <path d="M 260 210 Q 280 150 300 210 Z" fill="none" stroke="#38BDF8" stroke-width="2"/>
      <!-- Google Local Pin on Curitiba -->
      <path d="M 280 50 C 255 50 235 70 235 95 C 235 130 280 170 280 170 C 280 170 325 130 325 95 C 325 70 305 50 280 50 Z" fill="#38BDF8"/>
      <circle cx="280" cy="90" r="14" fill="#071A2F"/>
      <text x="280" y="96" fill="#38BDF8" font-size="14" font-weight="900" text-anchor="middle">CWB</text>
      <text x="280" y="255" fill="#FFFFFF" font-size="15" font-weight="800" text-anchor="middle">DOMÍNIO DE BUSCAS EM CURITIBA &amp; REGIÃO</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#071A2F" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="138" height="26" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#38BDF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SEO &amp; GOOGLE</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Como Posicionar Sua Empresa no Google</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">em Curitiba e Região Metropolitana</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>