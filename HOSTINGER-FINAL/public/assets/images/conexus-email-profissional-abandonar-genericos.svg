<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_email_profissional_abandonar_enderecos_genericos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E3A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <pattern id="gridPattern_email_profissional_abandonar_enderecos_genericos" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_email_profissional_abandonar_enderecos_genericos)" />
  <rect width="860" height="440" fill="url(#gridPattern_email_profissional_abandonar_enderecos_genericos)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#2DD4BF" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Corporate Email vs Generic Webmail -->
      <rect x="50" y="40" width="200" height="170" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
      <text x="150" y="75" fill="#EF4444" font-size="13" font-weight="800" text-anchor="middle">❌ E-MAIL GENÉRICO</text>
      <text x="150" y="115" fill="#94A3B8" font-size="11" font-family="monospace" text-anchor="middle">empresa@gmail.com</text>
      <text x="150" y="155" fill="#EF4444" font-size="11" text-anchor="middle">Passa amadorismo</text>
      <text x="150" y="180" fill="#EF4444" font-size="11" text-anchor="middle">e baixa confiança</text>

      <rect x="310" y="40" width="200" height="170" rx="10" fill="#0B2545" stroke="#10B981" stroke-width="2.5"/>
      <text x="410" y="75" fill="#10B981" font-size="13" font-weight="800" text-anchor="middle">✔ E-MAIL CORPORATIVO</text>
      <text x="410" y="115" fill="#FFFFFF" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">contato@suaempresa.com.br</text>
      <text x="410" y="155" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle">Autoridade Imediata</text>
      <text x="410" y="180" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle">Segurança e Prestígio</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#091E3A" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="223.5" height="26" rx="4" fill="#2DD4BF" fill-opacity="0.15" stroke="#2DD4BF" stroke-width="1.2" />
    <text x="12" y="17" fill="#2DD4BF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TRANSFORMAÇÃO DIGITAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">E-mail Profissional: Por Que Sua Empresa</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Deve Abandonar Endereços Gratuitos Imediatamente</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>