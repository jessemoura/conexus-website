<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_ia_no_atendimento_ao_cliente_vantagens_cuidados" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <pattern id="gridPattern_ia_no_atendimento_ao_cliente_vantagens_cuidados" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_ia_no_atendimento_ao_cliente_vantagens_cuidados)" />
  <rect width="860" height="440" fill="url(#gridPattern_ia_no_atendimento_ao_cliente_vantagens_cuidados)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#818CF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- AI Customer Support Agent -->
      <circle cx="280" cy="110" r="55" fill="#1E293B" stroke="#818CF8" stroke-width="3"/>
      <!-- Headset & Face -->
      <circle cx="280" cy="105" r="28" fill="#818CF8"/>
      <path d="M 240 110 A 40 40 0 0 1 320 110" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <rect x="235" y="105" width="10" height="20" rx="3" fill="#FFFFFF"/>
      <rect x="315" y="105" width="10" height="20" rx="3" fill="#FFFFFF"/>
      <path d="M 320 115 L 305 130" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="302" cy="132" r="4" fill="#00F0FF"/>
      <!-- Stats tags -->
      <rect x="70" y="180" width="180" height="35" rx="6" fill="#10B981"/>
      <text x="160" y="202" fill="#071A2F" font-size="12" font-weight="900" text-anchor="middle">✔ RESPOSTA INSTANTÂNEA</text>

      <rect x="310" y="180" width="180" height="35" rx="6" fill="#F59E0B"/>
      <text x="400" y="202" fill="#071A2F" font-size="12" font-weight="900" text-anchor="middle">⚠️ SUPERVISÃO HUMANA</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0F172A" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="242.5" height="26" rx="4" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#818CF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">INTELIGÊNCIA ARTIFICIAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">IA no Atendimento ao Cliente: Vantagens</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Comerciais e Cuidados Essenciais</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>