<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_como_usar_chatgpt_dia_a_dia_da_empresa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <pattern id="gridPattern_como_usar_chatgpt_dia_a_dia_da_empresa" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_como_usar_chatgpt_dia_a_dia_da_empresa)" />
  <rect width="860" height="440" fill="url(#gridPattern_como_usar_chatgpt_dia_a_dia_da_empresa)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#818CF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- ChatGPT Prompt Engineering Dialogue -->
      <rect x="60" y="25" width="440" height="210" rx="12" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
      <!-- User Prompt -->
      <rect x="85" y="45" width="390" height="60" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
      <text x="105" y="70" fill="#38BDF8" font-size="12" font-weight="800">PROMPT ESTRATÉGICO:</text>
      <text x="105" y="90" fill="#FFFFFF" font-size="11">"Estruture um plano de atendimento e scripts para WhatsApp..."</text>
      <!-- AI Response -->
      <rect x="85" y="115" width="390" height="95" rx="8" fill="rgba(129, 140, 248, 0.15)" stroke="#818CF8" stroke-width="1.5"/>
      <text x="105" y="140" fill="#818CF8" font-size="12" font-weight="800">RESPOSTA DA IA CONEXUS:</text>
      <text x="105" y="165" fill="#E2E8F0" font-size="11">1. Qualificação imediata do lead em 3 perguntas-chave</text>
      <text x="105" y="185" fill="#E2E8F0" font-size="11">2. Envio automático de tabela de preços e portfólio</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0F172A" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="242.5" height="26" rx="4" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#818CF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">INTELIGÊNCIA ARTIFICIAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Como Usar o ChatGPT no Dia</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">a Dia da Empresa com Eficiência e Segurança</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>