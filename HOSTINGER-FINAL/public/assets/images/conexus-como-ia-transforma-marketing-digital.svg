<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_como_ia_esta_transformando_marketing_digital" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <pattern id="gridPattern_como_ia_esta_transformando_marketing_digital" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_como_ia_esta_transformando_marketing_digital)" />
  <rect width="860" height="440" fill="url(#gridPattern_como_ia_esta_transformando_marketing_digital)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#818CF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- AI Marketing Waves & Predictive Targeting -->
      <path d="M 60 180 Q 160 80 280 140 T 500 90" fill="none" stroke="#818CF8" stroke-width="4"/>
      <circle cx="280" cy="140" r="10" fill="#818CF8"/>
      <circle cx="500" cy="90" r="10" fill="#00F0FF"/>
      <!-- Target lenses -->
      <circle cx="180" cy="110" r="45" fill="none" stroke="#00F0FF" stroke-width="2"/>
      <line x1="180" y1="55" x2="180" y2="165" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="125" y1="110" x2="235" y2="110" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="180" y="115" fill="#00F0FF" font-size="12" font-weight="900" text-anchor="middle">LEAD B2B</text>

      <rect x="310" y="140" width="180" height="85" rx="8" fill="#0F172A" stroke="#818CF8" stroke-width="1.5"/>
      <text x="400" y="165" fill="#818CF8" font-size="12" font-weight="800" text-anchor="middle">HIPERPERSONALIZAÇÃO</text>
      <text x="400" y="188" fill="#FFFFFF" font-size="11" text-anchor="middle">Conversão em tempo real</text>
      <text x="400" y="206" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle">+68% Eficiência de CAC</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0F172A" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="242.5" height="26" rx="4" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#818CF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">INTELIGÊNCIA ARTIFICIAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Como a Inteligência Artificial Está Transformando</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">o Marketing Digital em 2026</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>