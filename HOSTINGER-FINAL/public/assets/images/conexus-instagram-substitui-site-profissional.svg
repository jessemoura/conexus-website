<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_instagram_substitui_site_profissional" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <pattern id="gridPattern_instagram_substitui_site_profissional" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_instagram_substitui_site_profissional)" />
  <rect width="860" height="440" fill="url(#gridPattern_instagram_substitui_site_profissional)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#60A5FA" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Instagram Limitations vs Website Hub -->
      <rect x="70" y="30" width="180" height="210" rx="10" fill="#0B2545" stroke="#E1306C" stroke-width="2"/>
      <text x="160" y="65" fill="#E1306C" font-size="14" font-weight="800" text-anchor="middle">INSTAGRAM</text>
      <text x="160" y="105" fill="#EF4444" font-size="12" text-anchor="middle">⚠️ Algoritmo Instável</text>
      <text x="160" y="135" fill="#EF4444" font-size="12" text-anchor="middle">⚠️ Sem SEO no Google</text>
      <text x="160" y="165" fill="#EF4444" font-size="12" text-anchor="middle">⚠️ Sem Domínio Próprio</text>
      <text x="160" y="205" fill="#94A3B8" font-size="11" text-anchor="middle">Canal Complementar</text>

      <rect x="310" y="30" width="180" height="210" rx="10" fill="#0B2545" stroke="#00F0FF" stroke-width="2"/>
      <text x="400" y="65" fill="#00F0FF" font-size="14" font-weight="800" text-anchor="middle">SITE PROFISSIONAL</text>
      <text x="400" y="105" fill="#10B981" font-size="12" text-anchor="middle">✔ Ativo Permanente</text>
      <text x="400" y="135" fill="#10B981" font-size="12" text-anchor="middle">✔ #1 nas Buscas Google</text>
      <text x="400" y="165" fill="#10B981" font-size="12" text-anchor="middle">✔ Máxima Credibilidade</text>
      <text x="400" y="205" fill="#00F0FF" font-size="11" font-weight="800" text-anchor="middle">Hub Central da Marca</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#111827" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#60A5FA" fill-opacity="0.15" stroke="#60A5FA" stroke-width="1.2" />
    <text x="12" y="17" fill="#60A5FA" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MARKETING DIGITAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">O Instagram Pode Substituir um Site</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Profissional? Riscos e Limitações</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>