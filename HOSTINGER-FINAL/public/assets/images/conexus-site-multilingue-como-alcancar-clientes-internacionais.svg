<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_site_multilingue_como_alcancar_clientes_internacionais" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#134074" />
    </linearGradient>
    <pattern id="gridPattern_site_multilingue_como_alcancar_clientes_internacionais" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_site_multilingue_como_alcancar_clientes_internacionais)" />
  <rect width="860" height="440" fill="url(#gridPattern_site_multilingue_como_alcancar_clientes_internacionais)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#00F0FF" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Globe with Language Nodes -->
      <circle cx="280" cy="140" r="95" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.8"/>
      <ellipse cx="280" cy="140" rx="45" ry="95" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.6"/>
      <line x1="185" y1="140" x2="375" y2="140" stroke="#00F0FF" stroke-width="1.5" opacity="0.6"/>
      <line x1="200" y1="90" x2="360" y2="90" stroke="#00F0FF" stroke-width="1.2" opacity="0.4"/>
      <line x1="200" y1="190" x2="360" y2="190" stroke="#00F0FF" stroke-width="1.2" opacity="0.4"/>
      <!-- Flag / Language Badges -->
      <rect x="70" y="90" width="85" height="40" rx="8" fill="#0B2545" stroke="#10B981" stroke-width="2"/>
      <text x="112" y="115" fill="#10B981" font-size="14" font-weight="900" text-anchor="middle">🇧🇷 PT-BR</text>
      <line x1="155" y1="110" x2="210" y2="120" stroke="#10B981" stroke-width="2" stroke-dasharray="3,3"/>
      
      <rect x="410" y="60" width="85" height="40" rx="8" fill="#0B2545" stroke="#3B82F6" stroke-width="2"/>
      <text x="452" y="85" fill="#3B82F6" font-size="14" font-weight="900" text-anchor="middle">🇬🇧 EN</text>
      <line x1="410" y1="80" x2="340" y2="100" stroke="#3B82F6" stroke-width="2" stroke-dasharray="3,3"/>

      <rect x="400" y="170" width="85" height="40" rx="8" fill="#0B2545" stroke="#EF4444" stroke-width="2"/>
      <text x="442" y="195" fill="#EF4444" font-size="14" font-weight="900" text-anchor="middle">🇪🇸 ES</text>
      <line x1="400" y1="190" x2="330" y2="170" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,3"/>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0B2545" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1.2" />
    <text x="12" y="17" fill="#00F0FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">WEBSITES &amp; DESIGN</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Site Multilíngue: Como Estruturar Sua Presença</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">para Alcançar Clientes Internacionais</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>