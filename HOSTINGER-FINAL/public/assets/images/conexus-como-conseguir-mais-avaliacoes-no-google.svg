<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_como_conseguir_mais_avaliacoes_no_google" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A2F" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
    <pattern id="gridPattern_como_conseguir_mais_avaliacoes_no_google" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_como_conseguir_mais_avaliacoes_no_google)" />
  <rect width="860" height="440" fill="url(#gridPattern_como_conseguir_mais_avaliacoes_no_google)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#38BDF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 25)">
      <!-- 5 Glowing Stars and Reviews Magnet -->
      <g transform="translate(40, 20)">
        <text x="50" y="60" fill="#F59E0B" font-size="48">★</text>
        <text x="110" y="60" fill="#F59E0B" font-size="48">★</text>
        <text x="170" y="60" fill="#F59E0B" font-size="48">★</text>
        <text x="230" y="60" fill="#F59E0B" font-size="48">★</text>
        <text x="290" y="60" fill="#F59E0B" font-size="48">★</text>
      </g>
      <!-- Review speech bubble cards -->
      <rect x="60" y="110" width="210" height="85" rx="10" fill="#0B2545" stroke="#10B981" stroke-width="1.5"/>
      <text x="80" y="135" fill="#F59E0B" font-size="12">★★★★★</text>
      <text x="80" y="155" fill="#E2E8F0" font-size="11">"Atendimento impecável e site veloz!"</text>
      <text x="80" y="175" fill="#94A3B8" font-size="10">- Cliente Verificado</text>

      <rect x="290" y="110" width="210" height="85" rx="10" fill="#0B2545" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="310" y="135" fill="#F59E0B" font-size="12">★★★★★</text>
      <text x="310" y="155" fill="#E2E8F0" font-size="11">"Aumentou nossos contatos em 300%."</text>
      <text x="310" y="175" fill="#94A3B8" font-size="10">- Diretor Comercial</text>
      <text x="280" y="235" fill="#10B981" font-size="14" font-weight="800" text-anchor="middle">+ REPUTAÇÃO = + VENDAS NO GOOGLE</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#071A2F" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="138" height="26" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#38BDF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SEO &amp; GOOGLE</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Como Conseguir Mais Avaliações 5 Estrelas</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">no Google de Forma Ética</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>