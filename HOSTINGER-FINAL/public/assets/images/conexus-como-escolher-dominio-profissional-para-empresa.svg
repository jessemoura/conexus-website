<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_como_escolher_dominio_profissional_para_empresa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#134074" />
    </linearGradient>
    <pattern id="gridPattern_como_escolher_dominio_profissional_para_empresa" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_como_escolher_dominio_profissional_para_empresa)" />
  <rect width="860" height="440" fill="url(#gridPattern_como_escolher_dominio_profissional_para_empresa)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#00F0FF" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 30)">
      <!-- URL Domain Browser Bar -->
      <rect x="40" y="40" width="480" height="80" rx="14" fill="#0B2545" stroke="#00F0FF" stroke-width="2.5"/>
      <rect x="65" y="60" width="30" height="38" rx="6" fill="#10B981"/>
      <text x="80" y="85" fill="#FFFFFF" font-size="18" font-weight="900" text-anchor="middle">🔒</text>
      <text x="110" y="85" fill="#FFFFFF" font-size="22" font-family="monospace" font-weight="700">https://suaempresa</text>
      <text x="380" y="85" fill="#00F0FF" font-size="22" font-family="monospace" font-weight="900">.com.br</text>
      <!-- Domain extension pills -->
      <rect x="60" y="150" width="110" height="40" rx="8" fill="#134074" stroke="#00F0FF" stroke-width="1.5"/>
      <text x="115" y="175" fill="#00F0FF" font-size="14" font-weight="800" text-anchor="middle">.com.br</text>
      <rect x="190" y="150" width="100" height="40" rx="8" fill="#134074" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="240" y="175" fill="#38BDF8" font-size="14" font-weight="800" text-anchor="middle">.press</text>
      <rect x="310" y="150" width="100" height="40" rx="8" fill="#134074" stroke="#818CF8" stroke-width="1.5"/>
      <text x="360" y="175" fill="#818CF8" font-size="14" font-weight="800" text-anchor="middle">.com</text>
      <rect x="430" y="150" width="100" height="40" rx="8" fill="#134074" stroke="#2DD4BF" stroke-width="1.5"/>
      <text x="480" y="175" fill="#2DD4BF" font-size="14" font-weight="800" text-anchor="middle">.tech</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0B2545" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1.2" />
    <text x="12" y="17" fill="#00F0FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">WEBSITES &amp; DESIGN</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Como Escolher o Domínio Profissional Perfeito</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">para Sua Empresa</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>