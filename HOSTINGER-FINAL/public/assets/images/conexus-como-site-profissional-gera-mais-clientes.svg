<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_como_site_profissional_gera_mais_clientes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#134074" />
    </linearGradient>
    <pattern id="gridPattern_como_site_profissional_gera_mais_clientes" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_como_site_profissional_gera_mais_clientes)" />
  <rect width="860" height="440" fill="url(#gridPattern_como_site_profissional_gera_mais_clientes)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#00F0FF" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(120, 20)">
      <!-- Sales & Client Generation Flow -->
      <path d="M 80 40 L 480 40 L 400 130 L 160 130 Z" fill="rgba(0, 240, 255, 0.15)" stroke="#00F0FF" stroke-width="2"/>
      <text x="280" y="85" fill="#00F0FF" font-size="14" font-weight="800" text-anchor="middle">VISITANTES QUALIFICADOS (GOOGLE / REDES)</text>
      <path d="M 170 145 L 390 145 L 340 220 L 220 220 Z" fill="rgba(56, 189, 248, 0.25)" stroke="#38BDF8" stroke-width="2"/>
      <text x="280" y="185" fill="#38BDF8" font-size="14" font-weight="800" text-anchor="middle">AUTORIDADE &amp; PROPOSTA DE VALOR</text>
      <rect x="200" y="235" width="160" height="50" rx="10" fill="#10B981" stroke="#34D399" stroke-width="2"/>
      <text x="280" y="266" fill="#FFFFFF" font-size="15" font-weight="900" text-anchor="middle">🤝 NOVOS CLIENTES</text>
      <!-- Sparkle indicators -->
      <polygon points="490,90 510,95 495,110 500,130 480,115 460,125 470,105 455,90 475,95 485,75" fill="#F59E0B" transform="scale(0.5) translate(400, 40)"/>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0B2545" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1.2" />
    <text x="12" y="17" fill="#00F0FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">WEBSITES &amp; DESIGN</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Como um Site Profissional Pode Gerar</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Mais Clientes Todos os Dias</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>