<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_site_ou_instagram_qual_mais_importante" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <pattern id="gridPattern_site_ou_instagram_qual_mais_importante" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_site_ou_instagram_qual_mais_importante)" />
  <rect width="860" height="440" fill="url(#gridPattern_site_ou_instagram_qual_mais_importante)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#60A5FA" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Balanced Scales of Marketing -->
      <line x1="280" y1="50" x2="280" y2="210" stroke="#60A5FA" stroke-width="5"/>
      <line x1="160" y1="90" x2="400" y2="90" stroke="#60A5FA" stroke-width="5"/>
      <circle cx="280" cy="50" r="10" fill="#60A5FA"/>
      <!-- Instagram Pan -->
      <line x1="160" y1="90" x2="160" y2="130" stroke="#E1306C" stroke-width="2"/>
      <rect x="110" y="130" width="100" height="70" rx="10" fill="#0B2545" stroke="#E1306C" stroke-width="2"/>
      <text x="160" y="160" fill="#E1306C" font-size="20" text-anchor="middle">📷</text>
      <text x="160" y="185" fill="#E1306C" font-size="11" font-weight="800" text-anchor="middle">INSTAGRAM</text>
      <!-- Website Pan -->
      <line x1="400" y1="90" x2="400" y2="130" stroke="#00F0FF" stroke-width="2"/>
      <rect x="350" y="130" width="100" height="70" rx="10" fill="#0B2545" stroke="#00F0FF" stroke-width="2"/>
      <text x="400" y="160" fill="#00F0FF" font-size="20" text-anchor="middle">🌐</text>
      <text x="400" y="185" fill="#00F0FF" font-size="11" font-weight="800" text-anchor="middle">SITE PRÓPRIO</text>
      <text x="280" y="240" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">TERRENO PRÓPRIO VS REDE SOCIAL</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#111827" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#60A5FA" fill-opacity="0.15" stroke="#60A5FA" stroke-width="1.2" />
    <text x="12" y="17" fill="#60A5FA" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MARKETING DIGITAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Site Institucional ou Instagram: Qual é</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Mais Importante para Sua Empresa?</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>