<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_google_analytics_metricas_que_realmente_importam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071426" />
      <stop offset="100%" stop-color="#164E63" />
    </linearGradient>
    <pattern id="gridPattern_google_analytics_metricas_que_realmente_importam" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_google_analytics_metricas_que_realmente_importam)" />
  <rect width="860" height="440" fill="url(#gridPattern_google_analytics_metricas_que_realmente_importam)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#22D3EE" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- GA4 Essential Metrics -->
      <rect x="60" y="30" width="440" height="210" rx="12" fill="#071426" stroke="#22D3EE" stroke-width="2"/>
      <text x="100" y="68" fill="#F59E0B" font-size="16" font-weight="900">GA4 <tspan fill="#FFFFFF">Google Analytics 4</tspan></text>
      <!-- Key events list -->
      <rect x="90" y="90" width="380" height="30" rx="6" fill="#0F4C81"/>
      <text x="110" y="110" fill="#10B981" font-size="11" font-weight="800">✔ clique_whatsapp</text>
      <text x="380" y="110" fill="#FFFFFF" font-size="11" font-weight="700">184 eventos</text>

      <rect x="90" y="130" width="380" height="30" rx="6" fill="#0F4C81"/>
      <text x="110" y="150" fill="#10B981" font-size="11" font-weight="800">✔ envio_formulario</text>
      <text x="380" y="150" fill="#FFFFFF" font-size="11" font-weight="700">62 eventos</text>

      <rect x="90" y="170" width="380" height="30" rx="6" fill="#0F4C81"/>
      <text x="110" y="190" fill="#10B981" font-size="11" font-weight="800">✔ tempo_engajamento</text>
      <text x="380" y="190" fill="#FFFFFF" font-size="11" font-weight="700">2m 45s média</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#071426" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="252" height="26" rx="4" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-width="1.2" />
    <text x="12" y="17" fill="#22D3EE" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CRESCIMENTO &amp; TECNOLOGIA</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Google Analytics 4 (GA4): As Únicas</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Métricas que Empresários Precisam Acompanhar</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>