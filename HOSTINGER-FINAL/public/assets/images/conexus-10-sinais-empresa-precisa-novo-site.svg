<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_10_sinais_empresa_precisa_novo_site" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#134074" />
    </linearGradient>
    <pattern id="gridPattern_10_sinais_empresa_precisa_novo_site" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_10_sinais_empresa_precisa_novo_site)" />
  <rect width="860" height="440" fill="url(#gridPattern_10_sinais_empresa_precisa_novo_site)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#00F0FF" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(120, 20)">
      <!-- Diagnostic Monitor -->
      <rect x="80" y="20" width="460" height="260" rx="14" fill="#0B2545" stroke="#EF4444" stroke-width="2.5" opacity="0.9"/>
      <line x1="80" y1="65" x2="540" y2="65" stroke="#EF4444" stroke-width="1.5" opacity="0.4"/>
      <circle cx="110" cy="42" r="6" fill="#EF4444"/>
      <circle cx="130" cy="42" r="6" fill="#F59E0B"/>
      <circle cx="150" cy="42" r="6" fill="#10B981"/>
      <text x="310" y="48" fill="#EF4444" font-size="13" font-family="sans-serif" font-weight="800" text-anchor="middle">AUDITORIA DE OBSOLESCÊNCIA</text>
      <!-- Error / Alert rows -->
      <rect x="110" y="85" width="400" height="36" rx="6" fill="rgba(239, 68, 68, 0.15)" stroke="#EF4444" stroke-width="1"/>
      <text x="130" y="108" fill="#EF4444" font-size="13" font-weight="700">⚠️ ALERTA: Tempo de carregamento &gt; 3.8s</text>
      <rect x="110" y="135" width="400" height="36" rx="6" fill="rgba(239, 68, 68, 0.15)" stroke="#EF4444" stroke-width="1"/>
      <text x="130" y="158" fill="#EF4444" font-size="13" font-weight="700">⚠️ ALERTA: Quebra de layout mobile detectada</text>
      <rect x="110" y="185" width="400" height="36" rx="6" fill="rgba(239, 68, 68, 0.15)" stroke="#EF4444" stroke-width="1"/>
      <text x="130" y="208" fill="#EF4444" font-size="13" font-weight="700">⚠️ ALERTA: Ausência de certificado SSL seguro</text>
      <rect x="110" y="235" width="180" height="28" rx="6" fill="#00F0FF" opacity="0.9"/>
      <text x="200" y="254" fill="#071A2F" font-size="12" font-weight="800" text-anchor="middle">REFORMULAÇÃO NECESSÁRIA</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0B2545" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1.2" />
    <text x="12" y="17" fill="#00F0FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">WEBSITES &amp; DESIGN</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">10 Sinais Claros de que Sua</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Empresa Precisa de um Novo Site Urgente</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>