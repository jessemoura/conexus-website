<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_por_que_velocidade_do_site_influencia_vendas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#134074" />
    </linearGradient>
    <pattern id="gridPattern_por_que_velocidade_do_site_influencia_vendas" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_por_que_velocidade_do_site_influencia_vendas)" />
  <rect width="860" height="440" fill="url(#gridPattern_por_que_velocidade_do_site_influencia_vendas)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#00F0FF" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Speed Gauge & Core Web Vitals -->
      <circle cx="280" cy="160" r="110" fill="none" stroke="#134074" stroke-width="18"/>
      <path d="M 190 220 A 110 110 0 1 1 370 220" fill="none" stroke="#00F0FF" stroke-width="18" stroke-linecap="round"/>
      <line x1="280" y1="160" x2="350" y2="100" stroke="#00F0FF" stroke-width="6" stroke-linecap="round"/>
      <circle cx="280" cy="160" r="16" fill="#00F0FF"/>
      <text x="280" y="210" fill="#00F0FF" font-size="32" font-weight="900" text-anchor="middle">99/100</text>
      <text x="280" y="240" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">PERFORMANCE CORE WEB VITALS</text>
      <!-- Lightning bolt -->
      <polygon points="430,60 400,120 425,120 395,190 450,110 425,110" fill="#F59E0B"/>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0B2545" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1.2" />
    <text x="12" y="17" fill="#00F0FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">WEBSITES &amp; DESIGN</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Por Que a Velocidade do Site</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Influencia Diretamente Suas Vendas e Ranqueamento no Google</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>