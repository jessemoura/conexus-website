<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_funil_de_vendas_digital_pequenas_empresas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <pattern id="gridPattern_funil_de_vendas_digital_pequenas_empresas" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_funil_de_vendas_digital_pequenas_empresas)" />
  <rect width="860" height="440" fill="url(#gridPattern_funil_de_vendas_digital_pequenas_empresas)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#60A5FA" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- 4 Stages Sales Funnel -->
      <polygon points="80,40 480,40 420,95 140,95" fill="#3B82F6" opacity="0.85"/>
      <text x="280" y="72" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">1. ATRAÇÃO (GOOGLE &amp; SOCIAL)</text>

      <polygon points="145,100 415,100 365,150 195,150" fill="#60A5FA" opacity="0.85"/>
      <text x="280" y="130" fill="#071A2F" font-size="13" font-weight="900" text-anchor="middle">2. ENGAJAMENTO NO SITE</text>

      <polygon points="200,155 360,155 320,200 240,200" fill="#F59E0B" opacity="0.9"/>
      <text x="280" y="182" fill="#071A2F" font-size="12" font-weight="900" text-anchor="middle">3. PROPOSTA</text>

      <rect x="235" y="205" width="90" height="35" rx="6" fill="#10B981"/>
      <text x="280" y="228" fill="#FFFFFF" font-size="13" font-weight="900" text-anchor="middle">4. VENDA 💰</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#111827" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#60A5FA" fill-opacity="0.15" stroke="#60A5FA" stroke-width="1.2" />
    <text x="12" y="17" fill="#60A5FA" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MARKETING DIGITAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Funil de Vendas Digital para Pequenas</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Empresas: Do Primeiro Clique ao WhatsApp</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>