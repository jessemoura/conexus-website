<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_como_calcular_roi_site_profissional" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#134074" />
    </linearGradient>
    <pattern id="gridPattern_como_calcular_roi_site_profissional" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_como_calcular_roi_site_profissional)" />
  <rect width="860" height="440" fill="url(#gridPattern_como_calcular_roi_site_profissional)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#00F0FF" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 25)">
      <!-- ROI Calculator & Growth Charts -->
      <rect x="60" y="30" width="200" height="210" rx="10" fill="#0B2545" stroke="#10B981" stroke-width="2"/>
      <text x="160" y="65" fill="#10B981" font-size="15" font-weight="800" text-anchor="middle">RETORNO LÍQUIDO</text>
      <rect x="80" y="85" width="160" height="40" rx="6" fill="#134074"/>
      <text x="160" y="112" fill="#FFFFFF" font-size="18" font-family="monospace" font-weight="700" text-anchor="middle">ROI = 480%</text>
      <text x="160" y="160" fill="#A7F3D0" font-size="11" text-anchor="middle">(Ganho - Custo) / Custo</text>
      <rect x="80" y="180" width="160" height="35" rx="6" fill="#10B981"/>
      <text x="160" y="202" fill="#071A2F" font-size="12" font-weight="900" text-anchor="middle">RETORNO PREVISÍVEL</text>
      <!-- Rising Bars Chart -->
      <rect x="310" y="170" width="35" height="70" rx="4" fill="#134074" stroke="#00F0FF" stroke-width="1.5"/>
      <rect x="360" y="130" width="35" height="110" rx="4" fill="#00F0FF" opacity="0.6"/>
      <rect x="410" y="90" width="35" height="150" rx="4" fill="#00F0FF" opacity="0.85"/>
      <rect x="460" y="50" width="35" height="190" rx="4" fill="#10B981"/>
      <polyline points="325,160 375,120 425,80 475,40" fill="none" stroke="#F59E0B" stroke-width="4"/>
      <circle cx="475" cy="40" r="6" fill="#F59E0B"/>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0B2545" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1.2" />
    <text x="12" y="17" fill="#00F0FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">WEBSITES &amp; DESIGN</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Como Calcular o Retorno sobre Investimento</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">(ROI) de um Site Profissional</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>