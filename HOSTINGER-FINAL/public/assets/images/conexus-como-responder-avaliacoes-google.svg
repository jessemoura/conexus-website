<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_como_responder_avaliacoes_google_reputacao" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A2F" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
    <pattern id="gridPattern_como_responder_avaliacoes_google_reputacao" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_como_responder_avaliacoes_google_reputacao)" />
  <rect width="860" height="440" fill="url(#gridPattern_como_responder_avaliacoes_google_reputacao)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#38BDF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Review Response Dialogue UI -->
      <rect x="50" y="20" width="460" height="230" rx="12" fill="#071A2F" stroke="#38BDF8" stroke-width="2"/>
      <!-- Client review -->
      <rect x="75" y="45" width="410" height="70" rx="8" fill="#0B2545" stroke="#64748B" stroke-width="1"/>
      <text x="95" y="68" fill="#F59E0B" font-size="13">★★★★★ <tspan fill="#E2E8F0">"Excelente suporte e entrega rápida!"</tspan></text>
      <text x="95" y="95" fill="#94A3B8" font-size="11">Avaliado há 2 horas por Marcos Silva</text>
      <!-- Official response box -->
      <rect x="115" y="130" width="370" height="85" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="135" y="155" fill="#38BDF8" font-size="12" font-weight="800">Resposta do Proprietário (CONEXUS):</text>
      <text x="135" y="178" fill="#FFFFFF" font-size="11">"Olá Marcos, obrigado pela confiança! Nosso compromisso</text>
      <text x="135" y="196" fill="#FFFFFF" font-size="11">é garantir máxima eficiência e crescimento ao seu negócio."</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#071A2F" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="138" height="26" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#38BDF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SEO &amp; GOOGLE</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Como Responder Avaliações no Google (Positivas</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">e Negativas) e Fortalecer Sua Marca</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>