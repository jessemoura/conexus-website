<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_como_preparar_empresa_para_era_da_ia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <pattern id="gridPattern_como_preparar_empresa_para_era_da_ia" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_como_preparar_empresa_para_era_da_ia)" />
  <rect width="860" height="440" fill="url(#gridPattern_como_preparar_empresa_para_era_da_ia)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#818CF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- AI Readiness Roadmap & Digital Transformation -->
      <rect x="60" y="40" width="440" height="180" rx="12" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
      <line x1="60" y1="120" x2="500" y2="120" stroke="#818CF8" stroke-width="2" stroke-dasharray="4,4"/>
      <!-- 3 Stage Readiness Pillars -->
      <circle cx="130" cy="120" r="22" fill="#3B82F6"/>
      <text x="130" y="126" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">1</text>
      <text x="130" y="165" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">Dados Limpos</text>

      <circle cx="280" cy="120" r="22" fill="#818CF8"/>
      <text x="280" y="126" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">2</text>
      <text x="280" y="165" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">Ferramentas IA</text>

      <circle cx="430" cy="120" r="22" fill="#10B981"/>
      <text x="430" y="126" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">3</text>
      <text x="430" y="165" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">Escala &amp; Lucro</text>
      <text x="280" y="75" fill="#818CF8" font-size="14" font-weight="800" text-anchor="middle">ROADMAP DE PREPARAÇÃO CORPORATIVA 2026</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0F172A" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="242.5" height="26" rx="4" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#818CF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">INTELIGÊNCIA ARTIFICIAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Como Preparar Sua Empresa para a</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Era da Inteligência Artificial: Guia Estratégico</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>