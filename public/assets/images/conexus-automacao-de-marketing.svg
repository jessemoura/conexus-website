<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_automacao_de_marketing_economizar_tempo_vender_mais" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <pattern id="gridPattern_automacao_de_marketing_economizar_tempo_vender_mais" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_automacao_de_marketing_economizar_tempo_vender_mais)" />
  <rect width="860" height="440" fill="url(#gridPattern_automacao_de_marketing_economizar_tempo_vender_mais)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#818CF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Marketing Automation Workflow & Gears -->
      <rect x="60" y="40" width="100" height="60" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="2"/>
      <text x="110" y="65" fill="#818CF8" font-size="14" text-anchor="middle">Lead Entra</text>
      <text x="110" y="85" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">No Site</text>

      <line x1="160" y1="70" x2="210" y2="70" stroke="#818CF8" stroke-width="3"/>
      <polygon points="210,70 200,65 200,75" fill="#818CF8"/>

      <rect x="210" y="40" width="120" height="60" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
      <text x="270" y="65" fill="#38BDF8" font-size="14" text-anchor="middle">Qualificação</text>
      <text x="270" y="85" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Automática</text>

      <line x1="330" y1="70" x2="380" y2="70" stroke="#38BDF8" stroke-width="3"/>
      <polygon points="380,70 370,65 370,75" fill="#38BDF8"/>

      <rect x="380" y="40" width="120" height="60" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
      <text x="440" y="65" fill="#10B981" font-size="14" text-anchor="middle">Disparo</text>
      <text x="440" y="85" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">WhatsApp / CRM</text>
      <!-- Output results -->
      <rect x="150" y="150" width="260" height="50" rx="10" fill="#818CF8"/>
      <text x="280" y="181" fill="#071A2F" font-size="15" font-weight="900" text-anchor="middle">VENDAS NO PILOTO AUTOMÁTICO</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0F172A" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="242.5" height="26" rx="4" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#818CF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">INTELIGÊNCIA ARTIFICIAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Automação de Marketing: Como Economizar Tempo</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">e Vender Mais no Piloto Automático</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>