<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_como_criar_estrategia_digital_negocios_locais" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <pattern id="gridPattern_como_criar_estrategia_digital_negocios_locais" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_como_criar_estrategia_digital_negocios_locais)" />
  <rect width="860" height="440" fill="url(#gridPattern_como_criar_estrategia_digital_negocios_locais)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#60A5FA" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Local Strategy Compass & Channels -->
      <circle cx="280" cy="130" r="85" fill="#0B2545" stroke="#60A5FA" stroke-width="2"/>
      <polygon points="280,60 295,120 280,110 265,120" fill="#EF4444"/>
      <polygon points="280,200 295,140 280,150 265,140" fill="#60A5FA"/>
      <circle cx="280" cy="130" r="10" fill="#FFFFFF"/>
      <!-- 4 Channel nodes -->
      <rect x="60" y="110" width="80" height="40" rx="6" fill="#134074" stroke="#00F0FF" stroke-width="1.5"/>
      <text x="100" y="135" fill="#00F0FF" font-size="11" font-weight="800" text-anchor="middle">Website</text>

      <rect x="420" y="110" width="80" height="40" rx="6" fill="#134074" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="460" y="135" fill="#38BDF8" font-size="11" font-weight="800" text-anchor="middle">Google</text>

      <rect x="240" y="10" width="80" height="35" rx="6" fill="#134074" stroke="#818CF8" stroke-width="1.5"/>
      <text x="280" y="32" fill="#818CF8" font-size="11" font-weight="800" text-anchor="middle">Redes</text>

      <rect x="240" y="215" width="80" height="35" rx="6" fill="#134074" stroke="#10B981" stroke-width="1.5"/>
      <text x="280" y="237" fill="#10B981" font-size="11" font-weight="800" text-anchor="middle">WhatsApp</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#111827" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#60A5FA" fill-opacity="0.15" stroke="#60A5FA" stroke-width="1.2" />
    <text x="12" y="17" fill="#60A5FA" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MARKETING DIGITAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Como Criar uma Estratégia Digital Integrada</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">para Negócios Locais</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>