<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_seo_para_prestadores_de_servicos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A2F" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
    <pattern id="gridPattern_seo_para_prestadores_de_servicos" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_seo_para_prestadores_de_servicos)" />
  <rect width="860" height="440" fill="url(#gridPattern_seo_para_prestadores_de_servicos)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#38BDF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Service Provider Local SEO -->
      <rect x="70" y="30" width="420" height="210" rx="12" fill="#071A2F" stroke="#38BDF8" stroke-width="2"/>
      <!-- Service icons -->
      <circle cx="140" cy="90" r="35" fill="#0B2545" stroke="#38BDF8" stroke-width="2"/>
      <text x="140" y="100" fill="#38BDF8" font-size="30" text-anchor="middle">🔧</text>
      <text x="140" y="145" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">Serviços</text>
      
      <circle cx="280" cy="90" r="35" fill="#0B2545" stroke="#10B981" stroke-width="2"/>
      <text x="280" y="100" fill="#10B981" font-size="30" text-anchor="middle">📍</text>
      <text x="280" y="145" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">Busca Local</text>

      <circle cx="420" cy="90" r="35" fill="#0B2545" stroke="#00F0FF" stroke-width="2"/>
      <text x="420" y="100" fill="#00F0FF" font-size="30" text-anchor="middle">📲</text>
      <text x="420" y="145" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">WhatsApp</text>
      
      <line x1="180" y1="90" x2="240" y2="90" stroke="#38BDF8" stroke-width="2"/>
      <line x1="320" y1="90" x2="380" y2="90" stroke="#10B981" stroke-width="2"/>
      <text x="280" y="195" fill="#38BDF8" font-size="14" font-weight="800" text-anchor="middle">CAPTANDO CLIENTES COM ALTA INTENÇÃO</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#071A2F" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="138" height="26" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#38BDF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SEO &amp; GOOGLE</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">SEO para Prestadores de Serviços: Como</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Dominar Buscas Locais de Alta Conversão</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>