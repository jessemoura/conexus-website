<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_como_medir_se_site_traz_resultados" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071426" />
      <stop offset="100%" stop-color="#164E63" />
    </linearGradient>
    <pattern id="gridPattern_como_medir_se_site_traz_resultados" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_como_medir_se_site_traz_resultados)" />
  <rect width="860" height="440" fill="url(#gridPattern_como_medir_se_site_traz_resultados)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#22D3EE" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Financial Results & Attribution Dashboard -->
      <rect x="60" y="30" width="440" height="210" rx="12" fill="#071426" stroke="#22D3EE" stroke-width="2"/>
      <text x="280" y="65" fill="#22D3EE" font-size="15" font-weight="800" text-anchor="middle">MÉTRICAS FINANCEIRAS DO WEBSITE</text>
      <!-- 3 Metrics boxes -->
      <rect x="80" y="85" width="110" height="70" rx="8" fill="#0F4C81" stroke="#22D3EE" stroke-width="1"/>
      <text x="135" y="110" fill="#94A3B8" font-size="10" text-anchor="middle">Contatos/Mês</text>
      <text x="135" y="138" fill="#22D3EE" font-size="20" font-weight="900" text-anchor="middle">+142</text>

      <rect x="225" y="85" width="110" height="70" rx="8" fill="#0F4C81" stroke="#10B981" stroke-width="1"/>
      <text x="280" y="110" fill="#94A3B8" font-size="10" text-anchor="middle">Vendas Fechadas</text>
      <text x="280" y="138" fill="#10B981" font-size="20" font-weight="900" text-anchor="middle">38</text>

      <rect x="370" y="85" width="110" height="70" rx="8" fill="#0F4C81" stroke="#F59E0B" stroke-width="1"/>
      <text x="425" y="110" fill="#94A3B8" font-size="10" text-anchor="middle">Receita Gerada</text>
      <text x="425" y="138" fill="#F59E0B" font-size="18" font-weight="900" text-anchor="middle">R$ 84k</text>

      <text x="280" y="205" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">SITE COMO CENTRO DE LUCRO, NÃO CUSTO</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#071426" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="252" height="26" rx="4" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-width="1.2" />
    <text x="12" y="17" fill="#22D3EE" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CRESCIMENTO &amp; TECNOLOGIA</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Como Medir se Seu Site Realmente</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Está Trazendo Resultados Financeiros</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>