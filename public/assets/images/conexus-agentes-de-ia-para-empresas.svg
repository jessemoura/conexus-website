<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_agentes_de_ia_o_que_sao_como_ajudam_empresas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <pattern id="gridPattern_agentes_de_ia_o_que_sao_como_ajudam_empresas" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_agentes_de_ia_o_que_sao_como_ajudam_empresas)" />
  <rect width="860" height="440" fill="url(#gridPattern_agentes_de_ia_o_que_sao_como_ajudam_empresas)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#818CF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Autonomous AI Agents Feedback Loop -->
      <circle cx="280" cy="125" r="90" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-dasharray="8,6"/>
      <!-- 4 Agent Execution Nodes -->
      <circle cx="280" cy="35" r="22" fill="#3B82F6"/>
      <text x="280" y="41" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">Percepção</text>

      <circle cx="370" cy="125" r="22" fill="#818CF8"/>
      <text x="370" y="131" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">Decisão</text>

      <circle cx="280" cy="215" r="22" fill="#10B981"/>
      <text x="280" y="221" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">Execução</text>

      <circle cx="190" cy="125" r="22" fill="#F59E0B"/>
      <text x="190" y="131" fill="#071A2F" font-size="12" font-weight="900" text-anchor="middle">Ajuste</text>
      <text x="280" y="131" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">AGENTE IA</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#0F172A" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="242.5" height="26" rx="4" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#818CF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">INTELIGÊNCIA ARTIFICIAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Agentes Autônomos de IA: O Que</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">São e Como Estão Revolucionando as Empresas</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>