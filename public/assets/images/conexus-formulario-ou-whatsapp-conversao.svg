<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_formulario_ou_whatsapp_qual_gera_mais_contatos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071426" />
      <stop offset="100%" stop-color="#164E63" />
    </linearGradient>
    <pattern id="gridPattern_formulario_ou_whatsapp_qual_gera_mais_contatos" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_formulario_ou_whatsapp_qual_gera_mais_contatos)" />
  <rect width="860" height="440" fill="url(#gridPattern_formulario_ou_whatsapp_qual_gera_mais_contatos)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#22D3EE" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Form vs WhatsApp Conversion A/B Test -->
      <rect x="60" y="30" width="190" height="210" rx="10" fill="#071426" stroke="#38BDF8" stroke-width="2"/>
      <text x="155" y="65" fill="#38BDF8" font-size="13" font-weight="800" text-anchor="middle">FORMULÁRIO WEB</text>
      <rect x="80" y="85" width="150" height="20" rx="4" fill="#0F4C81"/>
      <rect x="80" y="115" width="150" height="20" rx="4" fill="#0F4C81"/>
      <rect x="80" y="145" width="150" height="35" rx="4" fill="#38BDF8"/>
      <text x="155" y="167" fill="#071426" font-size="11" font-weight="900" text-anchor="middle">Enviar Mensagem</text>
      <text x="155" y="210" fill="#94A3B8" font-size="11" text-anchor="middle">Para B2B Complexo</text>

      <rect x="310" y="30" width="190" height="210" rx="10" fill="#071426" stroke="#25D366" stroke-width="2.5"/>
      <text x="405" y="65" fill="#25D366" font-size="13" font-weight="800" text-anchor="middle">BOTÃO WHATSAPP</text>
      <circle cx="405" cy="115" r="30" fill="#25D366"/>
      <text x="405" y="125" fill="#FFFFFF" font-size="28" text-anchor="middle">💬</text>
      <rect x="330" y="160" width="150" height="35" rx="6" fill="#25D366"/>
      <text x="405" y="182" fill="#FFFFFF" font-size="11" font-weight="900" text-anchor="middle">Chamar no WhatsApp</text>
      <text x="405" y="215" fill="#10B981" font-size="11" font-weight="800" text-anchor="middle">Resposta Imediata</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#071426" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="252" height="26" rx="4" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-width="1.2" />
    <text x="12" y="17" fill="#22D3EE" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CRESCIMENTO &amp; TECNOLOGIA</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Formulário de Contato ou Botão de</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">WhatsApp: Qual Gera Mais Oportunidades?</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>