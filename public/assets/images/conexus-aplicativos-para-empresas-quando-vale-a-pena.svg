<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_aplicativos_para_empresas_quando_vale_a_pena" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071426" />
      <stop offset="100%" stop-color="#164E63" />
    </linearGradient>
    <pattern id="gridPattern_aplicativos_para_empresas_quando_vale_a_pena" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_aplicativos_para_empresas_quando_vale_a_pena)" />
  <rect width="860" height="440" fill="url(#gridPattern_aplicativos_para_empresas_quando_vale_a_pena)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#22D3EE" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Smartphone App UI vs Mobile Web -->
      <rect x="180" y="25" width="200" height="220" rx="20" fill="#071426" stroke="#22D3EE" stroke-width="3"/>
      <rect x="235" y="35" width="90" height="10" rx="5" fill="#0F4C81"/>
      <!-- App widgets -->
      <rect x="200" y="55" width="160" height="35" rx="6" fill="#22D3EE" opacity="0.2"/>
      <text x="280" y="77" fill="#22D3EE" font-size="11" font-weight="800" text-anchor="middle">📱 App Nativo</text>
      <rect x="200" y="100" width="75" height="50" rx="6" fill="#0F4C81"/>
      <rect x="285" y="100" width="75" height="50" rx="6" fill="#0F4C81"/>
      <rect x="200" y="160" width="160" height="35" rx="6" fill="#10B981"/>
      <text x="280" y="182" fill="#071A2F" font-size="11" font-weight="900" text-anchor="middle">Push Notifications</text>
      <!-- Decision comparison -->
      <rect x="50" y="90" width="110" height="70" rx="8" fill="#0F4C81" stroke="#38BDF8" stroke-width="1"/>
      <text x="105" y="120" fill="#38BDF8" font-size="11" font-weight="800" text-anchor="middle">Site Web</text>
      <text x="105" y="145" fill="#FFFFFF" font-size="10" text-anchor="middle">Aquisição Topo</text>

      <rect x="400" y="90" width="110" height="70" rx="8" fill="#0F4C81" stroke="#10B981" stroke-width="1"/>
      <text x="455" y="120" fill="#10B981" font-size="11" font-weight="800" text-anchor="middle">App Próprio</text>
      <text x="455" y="145" fill="#FFFFFF" font-size="10" text-anchor="middle">Retenção &amp; Uso</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#071426" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="252" height="26" rx="4" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-width="1.2" />
    <text x="12" y="17" fill="#22D3EE" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CRESCIMENTO &amp; TECNOLOGIA</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Aplicativos para Empresas: Quando Vale a</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Pena Desenvolver um App e Quando um Site é Suficiente?</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>