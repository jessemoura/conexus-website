<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="240" height="400" fill="#046A38"/>
  <rect x="240" width="360" height="400" fill="#DA291C"/>
  <g transform="translate(240, 200)">
    <!-- Armillary Sphere in Gold -->
    <circle r="85" fill="none" stroke="#FFDA44" stroke-width="12"/>
    <circle r="65" fill="none" stroke="#FFDA44" stroke-width="8"/>
    <ellipse rx="85" ry="32" fill="none" stroke="#FFDA44" stroke-width="8"/>
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#FFDA44" stroke-width="10"/>
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#FFDA44" stroke-width="10"/>
    <!-- Portuguese Shield -->
    <path d="M -42,-50 L 42,-50 L 42,15 C 42,48 0,65 0,65 C 0,65 -42,48 -42,15 Z" fill="#DA291C" stroke="#222" stroke-width="1.5"/>
    <!-- Inner White Shield -->
    <path d="M -28,-36 L 28,-36 L 28,12 C 28,36 0,50 0,50 C 0,50 -28,36 -28,12 Z" fill="#FFFFFF"/>
    <!-- 5 Blue Quinas (Shields) -->
    <!-- Center Quina -->
    <path d="M -6,-6 L 6,-6 L 6,4 C 6,10 0,13 0,13 C 0,13 -6,10 -6,4 Z" fill="#002776"/>
    <circle cx="0" cy="3" r="1.5" fill="#FFFFFF"/>
    <!-- Top Quina -->
    <path d="M -6,-24 L 6,-24 L 6,-14 C 6,-8 0,-5 0,-5 C 0,-5 -6,-8 -6,-14 Z" fill="#002776"/>
    <circle cx="0" cy="-15" r="1.5" fill="#FFFFFF"/>
    <!-- Bottom Quina -->
    <path d="M -6,12 L 6,12 L 6,22 C 6,28 0,31 0,31 C 0,31 -6,28 -6,22 Z" fill="#002776"/>
    <circle cx="0" cy="21" r="1.5" fill="#FFFFFF"/>
    <!-- Left Quina -->
    <path d="M -20,-6 L -8,-6 L -8,4 C -8,10 -14,13 -14,13 C -14,13 -20,10 -20,4 Z" fill="#002776"/>
    <circle cx="-14" cy="3" r="1.5" fill="#FFFFFF"/>
    <!-- Right Quina -->
    <path d="M 8,-6 L 20,-6 L 20,4 C 20,10 14,13 14,13 C 14,13 8,10 8,4 Z" fill="#002776"/>
    <circle cx="14" cy="3" r="1.5" fill="#FFFFFF"/>
    <!-- 7 Castles on Red Border (Gold) -->
    <rect x="-38" y="-48" width="8" height="8" fill="#FFDA44"/>
    <rect x="30" y="-48" width="8" height="8" fill="#FFDA44"/>
    <rect x="-4" y="-48" width="8" height="8" fill="#FFDA44"/>
    <rect x="-40" y="-12" width="8" height="8" fill="#FFDA44"/>
    <rect x="32" y="-12" width="8" height="8" fill="#FFDA44"/>
    <rect x="-24" y="28" width="8" height="8" fill="#FFDA44"/>
    <rect x="16" y="28" width="8" height="8" fill="#FFDA44"/>
  </g>
</svg>