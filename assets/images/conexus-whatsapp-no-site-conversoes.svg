<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_whatsapp_no_site_aumentar_contatos_conversoes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <pattern id="gridPattern_whatsapp_no_site_aumentar_contatos_conversoes" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_whatsapp_no_site_aumentar_contatos_conversoes)" />
  <rect width="860" height="440" fill="url(#gridPattern_whatsapp_no_site_aumentar_contatos_conversoes)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#60A5FA" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- WhatsApp Conversion Hub -->
      <circle cx="280" cy="130" r="60" fill="#25D366"/>
      <path d="M 280 85 C 255 85 235 105 235 130 C 235 139 238 147 242 154 L 236 175 L 258 169 C 265 173 272 175 280 175 C 305 175 325 155 325 130 C 325 105 305 85 280 85 Z" fill="#FFFFFF"/>
      <!-- Ping waves -->
      <circle cx="280" cy="130" r="80" fill="none" stroke="#25D366" stroke-width="3" opacity="0.6"/>
      <circle cx="280" cy="130" r="105" fill="none" stroke="#25D366" stroke-width="2" opacity="0.3"/>
      <!-- Notification badge -->
      <circle cx="330" cy="80" r="16" fill="#EF4444"/>
      <text x="330" y="86" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">+3</text>
      <text x="280" y="240" fill="#FFFFFF" font-size="15" font-weight="800" text-anchor="middle">ATENDIMENTO IMEDIATO = + CONVERSÕES</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#111827" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#60A5FA" fill-opacity="0.15" stroke="#60A5FA" stroke-width="1.2" />
    <text x="12" y="17" fill="#60A5FA" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MARKETING DIGITAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Botão de WhatsApp no Site: Boas</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Práticas de UX que Multiplicam Conversões</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>