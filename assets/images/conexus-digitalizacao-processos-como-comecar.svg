<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_digitalizacao_de_processos_como_comecar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E3A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <pattern id="gridPattern_digitalizacao_de_processos_como_comecar" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_digitalizacao_de_processos_como_comecar)" />
  <rect width="860" height="440" fill="url(#gridPattern_digitalizacao_de_processos_como_comecar)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#2DD4BF" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Process Digitization Step Blueprint -->
      <rect x="50" y="50" width="110" height="75" rx="8" fill="#1E293B" stroke="#2DD4BF" stroke-width="1.5"/>
      <text x="105" y="80" fill="#2DD4BF" font-size="12" font-weight="800" text-anchor="middle">1. MAPEAR</text>
      <text x="105" y="105" fill="#FFFFFF" font-size="11" text-anchor="middle">Gargalos</text>

      <line x1="160" y1="87" x2="220" y2="87" stroke="#2DD4BF" stroke-width="3"/>
      <polygon points="220,87 210,82 210,92" fill="#2DD4BF"/>

      <rect x="220" y="50" width="120" height="75" rx="8" fill="#1E293B" stroke="#2DD4BF" stroke-width="1.5"/>
      <text x="280" y="80" fill="#2DD4BF" font-size="12" font-weight="800" text-anchor="middle">2. DIGITALIZAR</text>
      <text x="280" y="105" fill="#FFFFFF" font-size="11" text-anchor="middle">Formulários Web</text>

      <line x1="340" y1="87" x2="400" y2="87" stroke="#2DD4BF" stroke-width="3"/>
      <polygon points="400,87 390,82 390,92" fill="#2DD4BF"/>

      <rect x="400" y="50" width="110" height="75" rx="8" fill="#10B981"/>
      <text x="455" y="80" fill="#071A2F" font-size="12" font-weight="900" text-anchor="middle">3. AUTOMATIZAR</text>
      <text x="455" y="105" fill="#071A2F" font-size="11" font-weight="800" text-anchor="middle">WhatsApp / CRM</text>

      <text x="280" y="195" fill="#FFFFFF" font-size="15" font-weight="800" text-anchor="middle">OPERAÇÃO PADRONIZADA E SEGURA</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#091E3A" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="223.5" height="26" rx="4" fill="#2DD4BF" fill-opacity="0.15" stroke="#2DD4BF" stroke-width="1.2" />
    <text x="12" y="17" fill="#2DD4BF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TRANSFORMAÇÃO DIGITAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Digitalização de Processos: Como Começar Sem</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Complicação e Sem Perder Tempo</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>