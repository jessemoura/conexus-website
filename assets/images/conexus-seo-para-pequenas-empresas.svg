<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad_seo_para_pequenas_empresas_guia_completo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A2F" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
    <pattern id="gridPattern_seo_para_pequenas_empresas_guia_completo" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad_seo_para_pequenas_empresas_guia_completo)" />
  <rect width="860" height="440" fill="url(#gridPattern_seo_para_pequenas_empresas_guia_completo)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#38BDF8" opacity="0.12" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Unique Thematic Graphical Element -->
  
    <g transform="translate(100, 20)">
      <!-- Google Top Search Ranking Card -->
      <rect x="50" y="30" width="460" height="220" rx="12" fill="#071A2F" stroke="#38BDF8" stroke-width="2"/>
      <rect x="80" y="55" width="400" height="35" rx="18" fill="#0F4C81" stroke="#38BDF8" stroke-width="1"/>
      <circle cx="105" cy="72" r="7" fill="#38BDF8"/>
      <line x1="110" y1="77" x2="118" y2="85" stroke="#38BDF8" stroke-width="2.5"/>
      <text x="130" y="78" fill="#FFFFFF" font-size="13" font-family="sans-serif">serviços em são josé dos pinhais</text>
      <!-- #1 Search Result Badge -->
      <rect x="80" y="110" width="400" height="110" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1.5"/>
      <rect x="100" y="125" width="45" height="20" rx="4" fill="#10B981"/>
      <text x="122" y="139" fill="#071A2F" font-size="11" font-weight="900" text-anchor="middle">#1 TOP</text>
      <text x="160" y="140" fill="#38BDF8" font-size="16" font-weight="800">Sua Empresa - Website Oficial</text>
      <text x="100" y="170" fill="#94A3B8" font-size="12">https://suaempresa.com.br/servicos/</text>
      <text x="100" y="195" fill="#E2E8F0" font-size="12">Líder no segmento com atendimento especializado e orçamentos rápidos...</text>
    </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="240" width="860" height="200" fill="#071A2F" opacity="0.9" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 270)">
    <!-- Badge -->
    <rect x="0" y="0" width="138" height="26" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#38BDF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SEO &amp; GOOGLE</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">SEO para Pequenas Empresas: O Guia</text>
    <text x="0" y="90" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Completo para Conquistar as Primeiras Posições</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>