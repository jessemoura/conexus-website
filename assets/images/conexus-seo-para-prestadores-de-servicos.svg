<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A2F" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad)" />
  <rect width="860" height="440" fill="url(#gridPattern)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#38BDF8" opacity="0.12" filter="blur(40px)" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" filter="blur(30px)" />

  <!-- Graphical Element -->
  <g transform="translate(140, 20)">
    <circle cx="400" cy="200" r="90" fill="none" stroke="#38BDF8" stroke-width="4" opacity="0.8"/><circle cx="400" cy="200" r="60" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,6" opacity="0.5"/><path d="M470 270 L550 350" stroke="#38BDF8" stroke-width="12" stroke-linecap="round"/><path d="M370 200 L390 220 L440 170" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="200" width="860" height="240" fill="url(#bgGrad)" opacity="0.85" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 260)">
    <!-- Badge -->
    <rect x="0" y="0" width="138" height="26" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.2" />
    <text x="12" y="17" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SEO & GOOGLE</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800">SEO para Prestadores de Serviços: Como</text>
    <text x="0" y="98" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="700">Dominar Buscas Locais de Alta Conversão</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="135" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>