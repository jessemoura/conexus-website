<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="url(#bgGrad)" />
  <rect width="860" height="440" fill="url(#gridPattern)" />

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="180" fill="#60A5FA" opacity="0.12" filter="blur(40px)" />
  <circle cx="150" cy="350" r="140" fill="#2563EB" opacity="0.1" filter="blur(30px)" />

  <!-- Graphical Element -->
  <g transform="translate(140, 20)">
    <path d="M220 300 L320 220 L420 260 L580 120" fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round"/><polygon points="580,120 540,130 570,160" fill="#60A5FA"/><circle cx="220" cy="300" r="8" fill="#60A5FA"/><circle cx="320" cy="220" r="8" fill="#60A5FA"/><circle cx="420" cy="260" r="8" fill="#60A5FA"/><circle cx="580" cy="120" r="10" fill="#FFFFFF"/>
  </g>

  <!-- Darkening Gradient Overlay at Bottom -->
  <rect x="0" y="200" width="860" height="240" fill="url(#bgGrad)" opacity="0.85" />

  <!-- Content Box / Card Header -->
  <g transform="translate(50, 260)">
    <!-- Badge -->
    <rect x="0" y="0" width="185.5" height="26" rx="4" fill="#60A5FA" fill-opacity="0.15" stroke="#60A5FA" stroke-width="1.2" />
    <text x="12" y="17" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MARKETING DIGITAL</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800">Como Criar uma Estratégia Digital Integrada</text>
    <text x="0" y="98" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="700">para Negócios Locais</text>
    
    <!-- Footer Brand & Date -->
    <text x="0" y="135" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">CONEXUS • Guia Estratégico Digital • 2026</text>
  </g>

  <!-- Top Brand Watermark -->
  <text x="790" y="50" fill="#FFFFFF" opacity="0.3" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2">CONEXUS</text>
</svg>